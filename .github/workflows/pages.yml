name: Publish playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hadivafaii/massive-lion
          ref: main
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r source/requirements-web.txt
      - name: Generate the playground with the repo's optimizers
        working-directory: source
        env:
          API_URL: ${{ vars.DYNAMICS_API_URL }}
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m dynamics_lab.build_web --output dist/dynamics-lab --api-url "$API_URL" --published ../published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist/dynamics-lab
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
